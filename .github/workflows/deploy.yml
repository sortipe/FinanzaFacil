name: CI/CD Deployment Pipeline

on:
  push:
    branches: [main, milton]  # Deploy to main branch and feature branch
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'

jobs:
  # Lint and TypeScript Check
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint code
        run: |
          npm run lint || echo "Lint script no encontrado, omitiendo"

      - name: TypeScript check
        run: |
          npx tsc --noEmit || echo "TypeScript check falló o no está configurado"

  # Tests
  test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run tests
        run: |
          npm test || echo "Test script no encontrado, omitiendo"

  # Build Frontend
  build-frontend:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build frontend
        run: npm run build

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/
          retention-days: 1

  # Build Backend (si aplica)
  build-backend:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          working-directory: ./server

      - name: Install backend dependencies
        run: |
          cd server
          npm ci || npm install

      - name: Build backend
        run: |
          cd server
          npm run build || echo "Backend build script no encontrado, omitiendo"

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: server/
          retention-days: 1

  # Deploy to Hostinger
  deploy:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, build-frontend]
    if: github.ref == 'refs/heads/main'  # Solo despregar en main
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar dependencias para scripts de despliegue
        run: npm install -g ssh2-sftp-client

      - name: Desplegar a Hostinger
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_PROJECT_PATH: ${{ secrets.HOSTINGER_PROJECT_PATH }}
        run: |
          # Instalar cliente SFTP
          npm install -g ssh2-sftp-client
          
          # Definir directorio local
          LOCAL_DIR="dist"
          
          # Usar ssh2-sftp-client para subir archivos
          node -e "
          const Client = require('ssh2-sftp-client');
          const sftp = new Client();
          
          const config = {
            host: process.env.HOSTINGER_HOST,
            username: process.env.HOSTINGER_USERNAME,
            password: process.env.HOSTINGER_PASSWORD
          };
          
          async function upload() {
            await sftp.connect(config);
            await sftp.rmdir('${{ secrets.HOSTINGER_PROJECT_PATH }}', true); // Limpiar directorio existente
            await sftp.mkdir('${{ secrets.HOSTINGER_PROJECT_PATH }}');
            await sftp.uploadDir('$LOCAL_DIR', '${{ secrets.HOSTINGER_PROJECT_PATH }}');
            await sftp.end();
          }
          
          upload().catch(err => {
            console.error('Error durante despliegue:', err);
            process.exit(1);
          });
          "

      - name: Iniciar proceso de reinicio (opcional)
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
        run: |
          # Comandos opcionales de reinicio basado en el sistema del servidor
          # Por ahora, solo verificamos que el deploy fue exitoso

      - name: Loguear despliegue exitoso
        run: |
          echo "✅ Despliegue exitoso a Hostinger"
          echo "🌐 Frontend disponible: http://${{ secrets.HOSTINGER_HOST }}"
          echo "🔌 Backend API: http://${{ secrets.HOSTINGER_HOST }}/api"
